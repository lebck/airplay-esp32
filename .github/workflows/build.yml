name: Build

# Reusable firmware build. Single source of truth for the target matrix,
# called by both ci.yml (pull requests / main) and release.yml (tags).
on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: esp32s3
            target: esp32s3
            chip: esp32s3
            layout: ota-3m-v1
            sdkconfig: "config/sdkconfig.defaults;config/sdkconfig.defaults.esp32s3"
          - name: seeed-xiao-esp32s3
            target: esp32s3
            chip: esp32s3
            layout: ota-3m-v1
            sdkconfig: "config/sdkconfig.defaults;config/sdkconfig.defaults.seeed-xiao-esp32s3"
          - name: waveshare-esp32s3
            target: esp32s3
            chip: esp32s3
            layout: ota-3m-v1
            sdkconfig: "config/sdkconfig.defaults;config/sdkconfig.defaults.waveshare-esp32s3"
          - name: esp32s2
            target: esp32s2
            chip: esp32s2
            layout: ota-1875k-v1
            sdkconfig: "config/sdkconfig.defaults;config/sdkconfig.defaults.esp32s2"
          - name: squeezeamp-bt
            target: esp32
            chip: esp32
            layout: ota-3m-v1
            sdkconfig: "config/sdkconfig.defaults;config/sdkconfig.defaults.squeezeamp;config/sdkconfig.defaults.bt"
          - name: squeezeamp-4m
            target: esp32
            chip: esp32
            layout: ota-1875k-v1
            sdkconfig: "config/sdkconfig.defaults;config/sdkconfig.defaults.squeezeamp-4m"
          - name: esparagus-audio-brick-bt
            target: esp32
            chip: esp32
            layout: ota-3m-v1
            sdkconfig: "config/sdkconfig.defaults;config/sdkconfig.defaults.esparagus-audio-brick;config/sdkconfig.defaults.bt"
          - name: smartamp
            target: esp32
            chip: esp32
            layout: ota-1875k-v1
            sdkconfig: "config/sdkconfig.defaults;config/sdkconfig.defaults.bt;config/sdkconfig.defaults.smartamp"
          - name: esparagus-louder-s3
            target: esp32s3
            chip: esp32s3
            layout: ota-3m-v1
            sdkconfig: "config/sdkconfig.defaults;config/sdkconfig.defaults.esparagus-louder-s3"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      # Match ci.yml: component manager 2.5.2 handles optional Kconfig symbols
      # in newer LVGL candidates while resolving the pinned LVGL 9.5.0.
      - name: Build ${{ matrix.name }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: ${{ matrix.target }}
          command: >
            python -m pip install --disable-pip-version-check idf-component-manager==2.5.2 &&
            idf.py -DSDKCONFIG_DEFAULTS="${{ matrix.sdkconfig }}"
            -DFIRMWARE_BUILD_VARIANT=${{ matrix.name }}
            -DFIRMWARE_UPDATE_LAYOUT=${{ matrix.layout }} build &&
            cd build &&
            esptool.py --chip ${{ matrix.target }} merge_bin --format raw -o merged-firmware.bin $(cat flash_args) &&
            cp merged-firmware.bin ../airplay2-receiver-${{ matrix.name }}.bin &&
            cp airplay2-receiver.bin ../airplay2-receiver-${{ matrix.name }}-ota.bin &&
            cd .. &&
            python scripts/create-firmware-metadata.py
            --variant ${{ matrix.name }}
            --chip ${{ matrix.chip }}
            --layout ${{ matrix.layout }}
            --version-file version.txt
            --asset airplay2-receiver-${{ matrix.name }}-ota.bin
            --output airplay2-receiver-${{ matrix.name }}.json

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v6
        with:
          name: firmware-${{ matrix.name }}
          path: |
            airplay2-receiver-${{ matrix.name }}.bin
            airplay2-receiver-${{ matrix.name }}-ota.bin
            airplay2-receiver-${{ matrix.name }}.json
          if-no-files-found: error
