name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  validate-release-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate tag matches version.txt
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH format, got '$tag'"
            exit 1
          fi

          tag_version="${tag#v}"
          file_version="$(tr -d '[:space:]' < version.txt)"

          if [[ ! "$file_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version.txt must contain MAJOR.MINOR.PATCH, got '$file_version'"
            exit 1
          fi

          if [[ "$tag_version" != "$file_version" ]]; then
            echo "::error::Release tag '$tag' does not match version.txt '$file_version'"
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          release_commit="$(git rev-list -n 1 "$tag")"
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "::error::Release tag '$tag' must point to a commit on main"
            exit 1
          fi

          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

  build:
    needs: validate-release-version
    uses: ./.github/workflows/build.yml

  release:
    needs: [validate-release-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select previous published release
        id: changelog-range
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --slurp > "$RUNNER_TEMP/releases.json"
          range="$(python3 scripts/release-range.py "$GITHUB_REF_NAME" "$RUNNER_TEMP/releases.json")"
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Generate Conventional Commits changelog
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.14.2
          config: cliff.toml
          args: ${{ steps.changelog-range.outputs.range }} --tag-pattern "^${{ github.ref_name }}$"
        env:
          OUTPUT: release-artifacts/CHANGELOG.md
          CHANGELOG_REPO: ${{ github.repository }}

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-artifacts
          pattern: firmware-*
          merge-multiple: true

      - name: Generate OTA update manifest
        run: |
          python3 scripts/create-update-manifest.py \
            --version '${{ needs.validate-release-version.outputs.version }}' \
            --directory release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate-release-version.outputs.version }}
          name: v${{ needs.validate-release-version.outputs.version }}
          body_path: release-artifacts/CHANGELOG.md
          files: |
            release-artifacts/CHANGELOG.md
            release-artifacts/*.bin
            release-artifacts/update-manifest.json
          fail_on_unmatched_files: true
          make_latest: true
          overwrite_files: true
